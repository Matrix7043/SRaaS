# Add this service to your existing docker-compose.yml
# It mounts the host Docker socket so the runner can spawn sibling containers.

services:
  scaas-runner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Mount Docker socket so runner can manage sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared staging directory so mounted file paths resolve on the host too
      - ~/scaas-data:/tmp/scaas
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
