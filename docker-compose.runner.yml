# Add this service to your existing docker-compose.yml.
# The staging path must be identical on the host and inside the runner
# so bind mounts created by the host Docker daemon resolve correctly.

services:
  scaas-runner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Mount Docker socket so runner can manage sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Host and container paths must stay identical
      - ${HOME}/scaas-data:${HOME}/scaas-data
    environment:
      - PYTHONUNBUFFERED=1
      - SCAAS_STAGING_DIR=${HOME}/scaas-data/staging
    restart: unless-stopped
